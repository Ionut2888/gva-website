name: Uptime Check

# Pings the production site on a schedule and emails on failure.
# External health check (like UptimeRobot) — catches full outages that
# Sentry can't (DNS down, hosting outage, expired cert, white-screen deploy).
#
# Reuses the same email secrets as the beta deploy:
#   EMAIL_USERNAME · EMAIL_PASSWORD · NOTIFY_EMAIL
#
# Caveats: GitHub's cron can lag 5-15 min under load, and scheduled
# workflows are auto-disabled after 60 days of repo inactivity.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:           # allow a manual "is it up?" check

jobs:
  check:
    name: Ping production
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        id: ping
        run: |
          URL="https://gvawebsite-b74d4.web.app"
          echo "Checking $URL …"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 5 "$URL" || echo "000")
          echo "HTTP status: $CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "200" ]; then
            echo "::error::Site returned $CODE (expected 200)"
            exit 1
          fi

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔴 GVA site DOWN — HTTP ${{ steps.ping.outputs.code }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "GVA Uptime <${{ secrets.EMAIL_USERNAME }}>"
          body: |
            🔴 Production health check FAILED
            ══════════════════════════════════════════

            URL:     https://gvawebsite-b74d4.web.app
            Status:  HTTP ${{ steps.ping.outputs.code }}  (expected 200)
            Time:    ${{ github.event.repository.updated_at }} (UTC, approx)

            The site did not respond with a healthy 200 OK. It may be down,
            mid-deploy, or have a DNS/cert problem.

            ──────────────────────────────────────────
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
