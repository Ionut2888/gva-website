name: Deploy — Production

# Triggered MANUALLY from the Actions tab → "Deploy — Production" → "Run workflow".
# Job 1 (ci): lint → unit tests → build — must all pass first.
# Job 2 (deploy): waits for ci, then requests manual approval via the
#   "production" GitHub Environment before executing the Firebase deploy.
# Production URL: https://gvawebsite-b74d4.web.app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy (defaults to main)'
        required: false
        default: 'main'

jobs:
  # ── Job 1: CI gate ──────────────────────────────────────────────────────────
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      - name: Build
        run: npm run build

  # ── Job 2: Deploy (approval gate runs after CI passes) ──────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci                  # ← only starts if the ci job above passes
    environment: production    # ← approval is requested here, after CI is green

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gvawebsite-b74d4
          channelId: live
