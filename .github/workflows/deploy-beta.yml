name: Deploy — Beta

# Runs automatically when code lands on develop.
# Deploys to Firebase Hosting beta channel (no approval needed).
# Beta URL: https://gvawebsite-b74d4--beta.web.app

on:
  push:
    branches:
      - develop

jobs:
  deploy-beta:
    name: Build & Deploy to Beta
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (beta channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gvawebsite-b74d4
          channelId: beta
          expires: 30d
