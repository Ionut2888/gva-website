name: Deploy — Beta Preview

# Triggered when:
#   - A PR is labeled with "beta"  → first deploy for that PR
#   - New commits are pushed to a PR that already has the "beta" label → redeploy
#
# Builds the PR branch and deploys it to a unique Firebase Hosting preview
# channel (pr-<number>). The Firebase action automatically posts (or updates)
# a comment on the PR with the live preview URL.
#
# Preview URL pattern: https://gvawebsite-b74d4--pr-<number>-<hash>.web.app
# Channels expire after 7 days. See cleanup-beta.yml for early teardown.

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  deploy-beta:
    name: Build & Deploy Beta Preview
    runs-on: ubuntu-latest
    # Run when the label just added is "beta"  OR  the PR already carries the "beta" label
    if: |
      github.event.label.name == 'beta' ||
      contains(github.event.pull_request.labels.*.name, 'beta')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress --code-coverage

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (PR preview channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gvawebsite-b74d4
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
