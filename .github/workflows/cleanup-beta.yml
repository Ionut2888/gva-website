name: Cleanup — Remove Beta Preview

# Removes the Firebase Hosting preview channel when either:
#   - The PR is closed (merged or abandoned)
#   - The "beta" label is removed from the PR
#
# Channels expire after 7 days anyway, but this cleans them up immediately
# so the Hosting console stays tidy.

on:
  pull_request:
    types: [unlabeled, closed]

jobs:
  cleanup:
    name: Delete PR Preview Channel
    runs-on: ubuntu-latest
    # For "unlabeled": only act when the removed label was "beta"
    # For "closed": always attempt cleanup (safe even if channel never existed)
    if: |
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'beta')

    steps:
      - name: Write service account credential
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Delete Firebase Hosting preview channel
        run: |
          npx --yes firebase-tools@latest hosting:channel:delete \
            pr-${{ github.event.pull_request.number }} \
            --project gvawebsite-b74d4 \
            --force \
            --json || echo "Channel not found or already deleted — skipping."
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Clean up credential file
        if: always()
        run: rm -f /tmp/sa.json
