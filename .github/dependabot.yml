version: 2
updates:
  # Angular app (root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular*']
      dev-dependencies:
        dependency-type: development

  # Firebase Functions
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Sanity Studio
  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sanity:
        patterns: ['sanity', '@sanity*']

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
