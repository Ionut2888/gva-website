<section class="hero">
  <!-- Full-bleed background slideshow -->
  <div class="hero-bg" #heroBg>
    @for (slide of block.slides; track slide._key; let i = $index) {
      <div class="slide" [class.active]="i === currentSlide()">
        <img [src]="slide.src | sanitySrc:1920" [srcset]="slide.src | sanitySrcset"
             sizes="100vw" [alt]="slide.alt" decoding="async"
             [loading]="i === 0 ? 'eager' : 'lazy'"
             [attr.fetchpriority]="i === 0 ? 'high' : null">
      </div>
    }
  </div>

  <div class="hero-overlay"></div>

  <div class="container">
    <div class="hero-content">
      <div class="hero-badge">
        <span class="badge-text">{{ block.badge }}</span>
      </div>

      <h1>
        {{ block.h1_1 }}<br>
        <span class="hero-accent-text">{{ block.h1_2 }}</span>
      </h1>

      <p class="hero-subtitle">{{ block.subtitle }}</p>

      <div class="hero-features">
        <div class="feature">
          <div class="feature-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span>{{ block.f1 }}</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span>{{ block.f2 }}</span>
        </div>
        <div class="feature">
          <div class="feature-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span>{{ block.f3 }}</span>
        </div>
      </div>

      <div class="hero-buttons">
        <a [routerLink]="block.ctaPrimaryLink" class="btn btn-primary" appMagnetic>
          <span>{{ block.ctaPrimaryLabel }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a [routerLink]="block.ctaSecondaryLink" class="btn btn-secondary">
          <span>{{ block.ctaSecondaryLabel }}</span>
        </a>
      </div>
    </div>
  </div>
</section>
