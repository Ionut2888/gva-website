<div class="container">
  <div class="fleet-gallery">
    <div class="gallery-header" appAos="fade-up" [aosDelay]="50" [aosDuration]="1500">
      <h3>{{ block.heading }}</h3>
      <p>{{ block.subtitle }}</p>
    </div>

    <div class="gallery-grid">
      @for (image of block.images; track image._key) {
        <div class="gallery-item"
             role="button" tabindex="0"
             (click)="openLightbox(image)"
             (keyup.enter)="openLightbox(image)"
             (keyup.space)="openLightbox(image)">
          <img [src]="image.src | sanitySrc:768" [srcset]="image.src | sanitySrcset"
               sizes="(max-width: 600px) 100vw, (max-width: 1024px) 50vw, 33vw"
               [alt]="image.alt" loading="lazy" decoding="async">
        </div>
      }
    </div>
  </div>

  @if (selectedImage()) {
    <div class="lightbox-overlay"
         role="button" tabindex="0"
         (click)="closeLightbox()"
         (keyup.escape)="closeLightbox()">
      <div class="lightbox-content manifest-corners manifest-corners--light"
           role="document" tabindex="0"
           (click)="$event.stopPropagation()"
           (keyup)="$event.stopPropagation()">
        <button class="close-btn" (click)="closeLightbox()">
          <mat-icon>close</mat-icon>
        </button>
        <img [src]="selectedImage()!.src | sanitySrc:1366" [alt]="selectedImage()!.alt" decoding="async">
      </div>
    </div>
  }
</div>
