<section class="efficiency">
  <div class="container">
    <div class="efficiency-grid">

      <div class="efficiency-image" appAos="fade-right" [aosDuration]="1800">
        <img [src]="block.imageSrc | sanitySrc:1024" [srcset]="block.imageSrc | sanitySrcset"
             sizes="(max-width: 768px) 100vw, 50vw"
             [alt]="block.imageAlt" loading="lazy" decoding="async">
      </div>

      <div class="efficiency-text" appAos="fade-left" [aosDelay]="120" [aosDuration]="1800">
        <span class="section-eyebrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M1 17H3M21 17H23M3 17V13L5 9H15L19 13V17M3 17H19M19 17V13M5 9H15M6 13H10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="7" cy="19" r="1.5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="16" cy="19" r="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          {{ block.eyebrow }}
        </span>
        <h2>{{ block.heading }}</h2>
        <p>{{ block.body }}</p>

        <ul class="efficiency-list">
          @for (item of block.items; track item._key) {
            <li>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span><strong>{{ item.strong }}</strong> {{ item.text }}</span>
            </li>
          }
        </ul>

        <a [routerLink]="block.ctaLink" class="btn btn-primary efficiency-cta">
          <span>{{ block.ctaLabel }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14m-7-7l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

    </div>
  </div>
</section>
